<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear simulación | SUMO</title>
    <!-- MAPLIBRE-->
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
    
    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        html,body {
            height: 100%;
            background: #f8f9fa;
            margin: 0; 
            padding: 0;
        }
        .status-log {
            background: #0b1727;
            color: #d2e5ff;
            border-radius: 0.5rem;
            min-height: 260px;
            max-height: 340px;
            overflow-y: auto;
            padding: 0.9rem;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }
        .status-log .line {
            margin-bottom: 0.35rem;
        }

        #map { 
            height: 600px ; 
            border: 1px solid #000; 
        }
    </style>
    
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container py-4">
        <div class="row g-4">
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <strong><i class="bi bi-car-front-fill me-2"></i>Crear simulación de emisiones</strong>
                    </div>
                    <div class="card-body">
                        <form id="simulationForm" class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="num_vehicles" class="form-label">Número de vehículos</label>
                                <input type="number" class="form-control" id="num_vehicles" min="1" value="1000" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="duration_sec" class="form-label">Duración (segundos)</label>
                                <input type="number" class="form-control" id="duration_sec" min="1" value="3600" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="trip_period_sec" class="form-label">Periodo de salida estimado (s)</label>
                                <input type="number" class="form-control" id="trip_period_sec" min="0.01" step="0.01" value="3.60">
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="aggregation_period_sec" class="form-label">Periodo de agregación (s)</label>
                                <input type="number" class="form-control" id="aggregation_period_sec" min="1" value="60">
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="fringe_factor" class="form-label">Factor de salida (`fringe_factor`)</label>
                                <input type="number" class="form-control" id="fringe_factor" min="1" step="1" value="10">
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="output_factor" class="form-label">Factor de salida de vehículos</label>
                                <input type="number" class="form-control" id="output_factor" min="0.1" step="0.1" value="1.0">
                            </div>
                            <div class="col-12">
                                <label for="api_base_url" class="form-label">URL base de la API</label>
                                <input type="url" class="form-control" id="api_base_url" value="http://localhost:8001/">
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button type="submit" id="runBtn" class="btn btn-primary">
                                    <i class="bi bi-play-circle me-1"></i>Crear simulación
                                </button>
                                <button type="button" id="clearBtn" class="btn btn-outline-secondary">
                                    <i class="bi bi-eraser me-1"></i>Limpiar log
                                </button>
                                <button type="button" id="disconnectBtn" class="btn btn-outline-danger" disabled>
                                    <i class="bi bi-x-octagon me-1"></i>Desconectar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong>Estado</strong>
                        <span id="statusBadge" class="badge text-bg-secondary">Desconectado</span>
                    </div>
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <div id="statusSpinner" class="spinner-border spinner-border-sm text-primary d-none" role="status"></div>
                            <small id="statusText" class="text-muted">Esperando acción</small>
                        </div>
                        <div id="statusLog" class="status-log"></div>
                    </div>
                </div>
            </div>

        </div>

        <div class="row mt-4">
            <div class="col-9">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <strong><i class="bi bi-map me-2"></i>Mapa</strong>
                        <div style="width: 200px;">
                            <select id="mapSelector" class="form-select form-select-sm">
                                <option value="pamplona">Pamplona</option>
                                <option value="sancho">Zona Sancho El Fuerte</option>
                            </select>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
            <div class="col-3">
                <div class="card shadow-sm h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong>Calles prohibidas</strong>
                    </div>
                    <div class="card-body">
                        <ul id="bannedStreetsList" class="list-group">
                            <!-- Aquí se agregarán las calles prohibidas -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </main>

    
    <script type="module" src="./js/env.js"></script>
    <script>

        fetch('./js/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        });

        const form = document.getElementById('simulationForm');
        const runBtn = document.getElementById('runBtn');
        const clearBtn = document.getElementById('clearBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const statusLog = document.getElementById('statusLog');
        const statusSpinner = document.getElementById('statusSpinner');

        const numVehiclesInput = document.getElementById('num_vehicles');
        const durationInput = document.getElementById('duration_sec');
        const tripPeriodInput = document.getElementById('trip_period_sec');
        let bannedStreets = null;

        let socket = null;

        function addLog(message, isError = false) {
            const div = document.createElement('div');
            div.className = 'line';
            const now = new Date().toLocaleTimeString();
            div.textContent = `[${now}] ${message}`;
            if (isError) {
                div.style.color = '#ff8a8a';
            }
            statusLog.appendChild(div);
            statusLog.scrollTop = statusLog.scrollHeight;
        }

        function updateStatus(label, badgeClass, spinnerVisible) {
            statusBadge.className = `badge ${badgeClass}`;
            statusBadge.textContent = label;
            statusSpinner.classList.toggle('d-none', !spinnerVisible);
            statusText.textContent = label;
        }

        function calculateTripPeriod() {
            const vehicles = Number(numVehiclesInput.value);
            const duration = Number(durationInput.value);
            if (!Number.isFinite(vehicles) || vehicles <= 0 || !Number.isFinite(duration) || duration <= 0) {
                return;
            }
            tripPeriodInput.value = (duration / vehicles).toFixed(2);
        }

        numVehiclesInput.addEventListener('input', calculateTripPeriod);
        durationInput.addEventListener('input', calculateTripPeriod);
        calculateTripPeriod();

        clearBtn.addEventListener('click', () => {
            statusLog.innerHTML = '';
        });

        disconnectBtn.addEventListener('click', () => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close(1000, 'Desconexión manual');
            }
        });

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            if (socket && socket.readyState === WebSocket.OPEN) {
                addLog('Ya hay una simulación en curso. Cierra la conexión antes de lanzar otra.', true);
                return;
            }

            const apiBaseRaw = document.getElementById('api_base_url').value.trim();
            const apiBase = apiBaseRaw.endsWith('/') ? apiBaseRaw : `${apiBaseRaw}/`;

            const params = new URLSearchParams({
                num_vehicles: numVehiclesInput.value,
                duration_sec: durationInput.value,
                fringe_factor: document.getElementById('fringe_factor').value,
                aggregation_period_sec: document.getElementById('aggregation_period_sec').value,
                output_factor: document.getElementById('output_factor').value,
                trip_period_sec: tripPeriodInput.value,
                bannedStreets: Array.from(bannedStreets).join(','), // Convertimos el Set a un string separado por comas
                mapType: currentMap // Agregar tipo de mapa
            });

            const wsUrl = `${apiBase.replace('http://', 'ws://').replace('https://', 'wss://')}ws/simulationEmissions?${params.toString()}`;
            addLog(`Abriendo WebSocket: ${wsUrl}`);

            socket = new WebSocket(wsUrl);
            runBtn.disabled = true;
            disconnectBtn.disabled = false;
            updateStatus('Conectando...', 'text-bg-warning', true);

            socket.onopen = () => {
                updateStatus('Ejecutando', 'text-bg-primary', true);
                addLog('Conexión establecida. Simulación iniciada.');
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.mensaje) {
                        addLog(data.mensaje);
                    } else if (data.fin_simulacion) {
                        addLog(data.fin_simulacion);
                    } else {
                        addLog(`Mensaje: ${event.data}`);
                    }
                } catch {
                    addLog(`Mensaje sin JSON: ${event.data}`);
                }
            };

            socket.onerror = () => {
                updateStatus('Error', 'text-bg-danger', false);
                addLog('Error en la conexión WebSocket.', true);
            };

            socket.onclose = (event) => {
                if (event.code === 1000) {
                    updateStatus('Finalizado', 'text-bg-success', false);
                    addLog('Conexión cerrada correctamente.');
                } else {
                    updateStatus('Desconectado', 'text-bg-secondary', false);
                    addLog(`Conexión cerrada (código ${event.code}).`, true);
                }
                runBtn.disabled = false;
                disconnectBtn.disabled = true;
                loadSimulations();
            };
        });


        function loadMap() {
            const map = (window.map = new maplibregl.Map({
                container: 'map',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [-1.652673,42.805925],
                zoom: 15
            }));

            map.on('load', async () => {
                await loadStreetData('pamplona');
                attachMapListeners();
            });
            
            let center = [ -1.649963,42.810935];
            let zoom = 14;
            window.map.flyTo({
                center: center,
                zoom: zoom,
                duration: 1000
            });
        }

        async function loadStreetData(mapType) {
            try {
                let endpoint = window.endPoint + '/getPamplonaStreets';
                if (mapType === 'sancho') {
                    endpoint = window.endPoint + '/getSanchoStreets';
                }
                
                const responseStreets = await fetch(endpoint);
                const streetsData = await responseStreets.json();
                
                window.map.addSource('streets-source', {
                    type: 'geojson',
                    data: streetsData
                });
                
                window.map.addLayer({
                    id: 'capa-streets',
                    type: 'line',
                    source: 'streets-source',
                    paint: {
                        'line-width': 4,
                        'line-color': '#2690D1'
                    }
                });
            } catch (error) {
                console.error('Error cargando las calles:', error);
                addLog('Error al cargar las calles del mapa.', true);
            }
        }

        function attachMapListeners() {
            window.map.on("mouseenter", "capa-streets", () => {
                window.map.getCanvas().style.cursor = "pointer";
            });

            window.map.on("mouseleave", "capa-streets", () => {
                window.map.getCanvas().style.cursor = "";
            });

            window.map.on("click", "capa-streets", event => {
                const feature = event.features && event.features[0];
                if (!feature) {
                    return;
                }

                new maplibregl.Popup({ offset: 8 })
                    .setLngLat(event.lngLat)
                    .setHTML(
                        "<div style=\"font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;min-width:220px\">" +
                            "<strong>" + (feature.properties.nombre || "Calle sin nombre") + "</strong><br>" +
                            "ID: " + feature.properties.id + "<br>" +
                            "Tipo: " + feature.properties.tipo + "<br>" +
                            "Velocidad: " + feature.properties.velocidad_max + " km/h<br>" +   
                            "Carriles: " + feature.properties.carriles + "<br><br>" +
                            "<button onclick=\"prohibirStreet('" + feature.properties.id + "')\">Prohibir</button>" +
                        "</div>"
                    )
                    .addTo(window.map);
            });
        }

        bannedStreets = new Set();

        // Variable global para rastrear el mapa actual
        let currentMap = 'pamplona';

        function prohibirStreet(id) {
            // Aquí puedes agregar la lógica para enviar esta información al backend o actualizar el estado de la calle
            console.log("Prohibiendo calle con ID: ", id);
            bannedStreets.add(id);
            const listItem = document.createElement('li');
            listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
            listItem.id = `banned-street-${id}`;
            
            const streetLabel = document.createElement('span');
            streetLabel.textContent = `Calle ID: ${id}`;
            
            const badgeContainer = document.createElement('div');
            badgeContainer.className = 'd-flex gap-2 align-items-center';
            
            const badge = document.createElement('span');
            badge.className = 'badge text-bg-danger';
            badge.textContent = 'Prohibida';
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-sm btn-outline-danger';
            deleteBtn.textContent = 'Eliminar';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                eliminarStreet(id);
            };
            
            badgeContainer.appendChild(badge);
            badgeContainer.appendChild(deleteBtn);
            
            listItem.appendChild(streetLabel);
            listItem.appendChild(badgeContainer);
            
            document.getElementById('bannedStreetsList').appendChild(listItem);
        }

        function eliminarStreet(id) {
            console.log("Eliminando calle prohibida con ID: ", id);
            bannedStreets.delete(id);
            const listItem = document.getElementById(`banned-street-${id}`);
            if (listItem) {
                listItem.remove();
            }
        }

        // Event listener para el selector de mapas
        document.getElementById('mapSelector').addEventListener('change', async (event) => {
            currentMap = event.target.value;
            
            // Limpiar capas y fuentes anteriores
            if (window.map.getLayer('capa-streets')) {
                window.map.removeLayer('capa-streets');
            }
            if (window.map.getSource('streets-source')) {
                window.map.removeSource('streets-source');
            }
            
            // Limpiar lista de calles prohibidas
            bannedStreets.clear();
            document.getElementById('bannedStreetsList').innerHTML = '';
            
            // Determinar el endpoint según el mapa seleccionado
            let center = [ -1.649963,42.810935];
            let zoom = 12;
            
            if (currentMap === 'sancho') {
                center = [-1.651330, 42.808587]; // Ajusta las coordenadas según la zona de Sancho
                zoom = 14;
            }
            
            // Cargar nuevas calles
            try {
                await loadStreetData(currentMap);
                attachMapListeners();
                
                // Centrar el mapa
                window.map.flyTo({
                    center: center,
                    zoom: zoom,
                    duration: 1000
                });
                
            } catch (error) {
                console.error('Error cargando las calles:', error);
                addLog('Error al cargar las calles del mapa seleccionado.', true);
            }
        });

        loadMap();


    </script>
</body>
</html>

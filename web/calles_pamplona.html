<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calles de Pamplona</title>
    <meta property="og:description" content="Use the line-gradient and line-dasharray paint properties together to create a dashed line with gradient colors." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
     <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<div>
    <div id="navbar-container"></div>
</div>

<script src="./js/sumo.js"></script>
<div id="map">
    
</div>
<div id="spinnerOverlay" class="spinner-overlay" >
    <div class="spinner"></div> <b class="text_loading">Loading...</b>
</div>


<div id="velocidad-legend" class="legend">
    <h4>Velocidad (km/h)</h4>
    <div class="gradient-bar"></div>
    <div class="labels">
        <span>0</span>
        <span>50</span>
        <span>100</span>
        <span>140+</span>
    </div>
</div>

<script>

    window.endPoint= "http://localhost:8001"

    fetch('./js/navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
    });

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-1.652673,42.805925],
        zoom: 15
    }));


    async function cargarDatosCalles(endPoint)   {
        mostrarSpinner();
        
        const response = await fetch(endPoint + '/callesPamplona')
        .then(res => {
            if (!res.ok) {
                throw new Error('Network response was not ok');
            }
            return res.json();
        })
        .then(geojsonData => {

            console.log(geojsonData);
            // Añadimos la fuente de datos al mapa
            map.addSource('calles-pamplona', {
                type: 'geojson',
                data: geojsonData
            });

            // Añadimos la capa visual para las calles
            map.addLayer({
                id: 'capa-calles',
                type: 'line',
                source: 'calles-pamplona',
                paint: {
                    'line-width': 3,
                    // Color dinámico según la propiedad 'max_speed' que guardamos
                    'line-color': [
                        'interpolate',
                        ['linear'],
                        ['get', 'max_speed'],
                        0,      '#FFFFFF', // 0 km/h
                        1.39,   '#F2F12D', // 5 km/h
                        5.56,   '#EED322', // 20 km/h
                        8.33,   '#E6B71E', // 30 km/h
                        11.11,  '#DA9C20', // 40 km/h
                        13.89,  '#007324', // 50 km/h
                        19.44,  '#258C5D', // 70 km/h
                        22.22,  '#32A674', // 80 km/h
                        27.78,  '#3BB3C3', // 100 km/h
                        39.44,  '#004EB0'  // 140+ km/h
                    ],
                    'line-opacity': 0.8

                }

            })
            ocultarSpinner();
        })
        .catch(err => {
                console.error('Error fetching GeoJSON:', err)
                ocultarSpinner();   
            }); 
        };

    async function cargarNodosPamplona(endPoint) {
        mostrarSpinner();

        try {
            const res = await fetch(endPoint + '/nodosPamplona');
            if (!res.ok) {
                throw new Error('Network response was not ok');
            }

            const geojsonData = await res.json();
            console.log(geojsonData);

            if (!map.isStyleLoaded()) {
                await new Promise(resolve => map.once('load', resolve));
            }

            if (map.getSource('nodos-pamplona')) {
                map.getSource('nodos-pamplona').setData(geojsonData);
            } else {
                map.addSource('nodos-pamplona', {
                    type: 'geojson',
                    data: geojsonData
                });
            }

            if (!map.getLayer('capa-nodos')) {
                map.addLayer({
                    id: 'capa-nodos',
                    type: 'line',
                    source: 'nodos-pamplona',
                    layout: {
                        'line-cap': 'round',
                        'line-join': 'round'
                    },
                    paint: {
                        'line-width': 2.5,
                        'line-opacity': 0.9,
                        'line-color': [
                            'match',
                            ['downcase', ['coalesce', ['to-string', ['get', 'tipo_control']], '']],
                            'traffic_light', '#d1495b',
                            'priority', '#0f4c5c',
                            'right_before_left', '#f0b429',
                            'unregulated', '#64748b',
                            '#2563eb'
                        ]
                    }
                });
            }
        } catch (err) {
            console.error('Error fetching GeoJSON:', err);
        } finally {
            ocultarSpinner();
        }
    };
    
    cargarDatosCalles(window.endPoint);
    // cargarNodosPamplona(window.endPoint);
</script>


</body>
</html>

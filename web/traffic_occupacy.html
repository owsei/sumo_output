<!DOCTYPE html>
<html lang="en">
<head>
    <title>SUMO Simulation Occupancy</title>
    <meta property="og:description" content="Use the line-gradient and line-dasharray paint properties together to create a dashed line with gradient colors." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
     <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>



<div id="simulation-clock">
    <div class="clock-label">Tiempo de Simulación</div>
    <div id="time-display">00:00:00</div>
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    <button id="launch-btn">Iniciar</button>
    <button id="play-pause-btn">Pausa</button>
</div>

<div>
    <div id="navbar-container"></div>
</div>

<script src="./js/sumo.js"></script>
<div id="map"></div>
<script>
    
    fetch('./js/navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
    });


    window.isPaused = true;
    const btn = document.getElementById('play-pause-btn');
    const btnLaunch = document.getElementById('launch-btn');
    btn.style.disabled = true; // Deshabilitamos el botón hasta que se carguen los datos
    const timeDisplay = document.getElementById('time-display');
    const progressBar = document.getElementById('progress-bar');
    const dark_light = document.getElementById('dark_light');
    
    // Evento Click para el botón
    btn.addEventListener('click', () => {
        window.isPaused = !window.isPaused;
        btn.innerText = window.isPaused ? 'Reanudar' : 'Pausa';
        btn.classList.toggle('paused', window.isPaused);
    });

    btnLaunch.addEventListener('click', () => {
        window.isPaused = !window.isPaused;
        cargarDatos(window.endPoint);
        // btnLaunch.disabled = true; // Deshabilitamos el botón de lanzamiento después de hacer clic
    });


    window.endPoint= "http://localhost:8001"

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-1.652673,42.805925],
        zoom: 15
    }));



    async function cargarDatos(endPoint)   {

        const response = await fetch(endPoint + '/get-traffic-data')
        .then(res => {
            res.json().then(geojsonData => {
                
                console.log(geojsonData);
                map.addSource('sumo-source', {
                    type: 'geojson',
                    data: geojsonData // Pasamos los datos recibidos de la API
                });

                map.addLayer({
                    id: 'capa-occupacy',
                    type: 'line',
                    source: 'sumo-source',
                    paint: {
                        'line-width': 3,
                        'line-color': [
                            'interpolate',
                            ['linear'],
                            ['coalesce', ['get', '0', ['get', 'occupancy_por_tiempo']], 0], // Empezamos en el segundo 0
                            0, '#F3F4F6', // De 0 a 9.9
                            1, '#34D399', // De 10 a 19.9
                            2, '#FACC15', // De 20 a 29.9
                            3, '#FB923C', // De 30 a 39.9
                            4, '#F87171', // De 40 a 49.9
                            5, '#991B1B',  // 50 o más
                            6, '#7F1D1D',  // 60 o más
                            7, '#4B0808',  // 70 o más
                            8, '#2B0505',  // 80 o más
                            9, '#1A0303',  // 90 o más
                            10, '#0D0202',  // 100 o más
                            11, '#050101',  // 110 o más
                            12, '#020000',  // 120 o más
                        ]
                    }
                });

                lanzarAnimacion();

            })
        })
        .catch(err => console.error("Error al cargar datos:", err));

    }
        

    function lanzarAnimacion() {
        // Lógica de animación (igual que antes)
        let time = 0;
        setInterval(() => {
            if (window.isPaused) return;
            time = (time + 10) % 7200;
            const timeKey = time.toString();
            console.log(timeKey);
            timeDisplay.innerText = formatTime(time);
            const percentage = (time / 7200) * 100;
            progressBar.style.width = `${percentage}%`;
            map.setPaintProperty('capa-occupacy', 'line-color', [
                'interpolate',
                ['linear'],
                // LEEMOS LA PROPIEDAD DINÁMICA: timeKey en lugar de '0'
                ['coalesce', 
                    ['to-number', ['get', timeKey, ['get', 'occupancy_por_tiempo']]], 
                    0 // Si no hay datos en ese segundo, usamos 0 (Gris claro)
                ],
                0,  '#F3F4F6', // Vacío - Gris muy claro
                2,  '#34D399', // Fluido - Verde
                5,  '#FACC15', // Lento - Amarillo
                10, '#FB923C', // Denso - Naranja
                15, '#F87171', // Atasco - Rojo
                20, '#991B1B'  // Saturado - Granate
            ]);
        }, 500);
    }

    // formato de tiempo en horas, minutos y segundos
    function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return [h, m, s].map(v => v < 10 ? "0" + v : v).join(":");
    }
    
    // document.getElementById('estilos').addEventListener('change', function (e) {
    //     map.setStyle(e.target.value);
    // });

    function toggleTheme() {
        const currentStyle = map.getStyle().sprite;
        const newStyle = currentStyle.includes('positron') ? 'https://tiles.stadiamaps.com/styles/alidade_smooth_dark.json' : 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';
        map.setStyle(newStyle);
        dark_light.className = currentStyle.includes('positron') ? 'bi bi-moon-fill' : 'bi bi-brightness-alt-high-fill';
    }
</script>


</body>
</html>

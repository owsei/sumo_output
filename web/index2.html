<script>
    let isPaused = false;
    const btn = document.getElementById('play-pause-btn');
    const timeDisplay = document.getElementById('time-display');
    const progressBar = document.getElementById('progress-bar');

    // Evento Click para el botón
    btn.addEventListener('click', () => {
        isPaused = !isPaused;
        btn.innerText = isPaused ? 'Reanudar' : 'Pausa';
        btn.classList.toggle('paused', isPaused);
    });


    window.endPoint= "http://localhost:8001"

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-1.652673,42.805925],
        zoom: 15
    }));

    map.on('load', async () => {
        // Llamada al backend de FastAPI
        const response = await fetch(window.endPoint + '/get-emission-data')
        const geojsonData = await response.json();
        console.log(geojsonData);

        isPaused = true; // Pausamos para analizar
        btn.innerText = 'Reanudar';

        map.addSource('sumo-source', {
            type: 'geojson',
            data: geojsonData // Pasamos los datos recibidos de la API
        });

        map.addLayer({
            id: 'capa-nox_por_tiempo',
            type: 'line',
            source: 'sumo-source',
            paint: {
                'line-width': 3,
                'line-color': [
                    'interpolate',
                    ['linear'],
                    ['coalesce', ['get', '0', ['get', 'nox_por_tiempo']], 0], // Empezamos en el segundo 0
                    0, '#F3F4F6', // De 0 a 9.9
                    10, '#34D399', // De 10 a 19.9
                    20, '#FACC15', // De 20 a 29.9
                    30, '#FB923C', // De 30 a 39.9
                    40, '#F87171', // De 40 a 49.9
                    50, '#991B1B'  // 50 o más
                ]
            }
        });


        // Lógica de animación (igual que antes)
        let time = 0;
        setInterval(() => {
            if (isPaused) return;
            time = (time + 10) % 7200;
            const timeKey = time.toString();
            console.log(timeKey);
            timeDisplay.innerText = formatTime(time);
            const percentage = (time / 7200) * 100;
            progressBar.style.width = `${percentage}%`;
            map.setPaintProperty('capa-nox_por_tiempo', 'line-color', [
                'interpolate',
                ['linear'],
                ['coalesce', ['get', time.toString(), ['get', 'nox_por_tiempo']], 0],
                0, '#F3F4F6', // De 0 a 9.9
                10, '#34D399', // De 10 a 19.9
                20, '#FACC15', // De 20 a 29.9
                30, '#FB923C', // De 30 a 39.9
                40, '#F87171', // De 40 a 49.9
                50, '#991B1B'  // 50 o más
            ]);
        }, 500);

    });

    function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return [h, m, s].map(v => v < 10 ? "0" + v : v).join(":");
    }
</script>

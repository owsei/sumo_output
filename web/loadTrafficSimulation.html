<!DOCTYPE html>
<html lang="es">
<head>
    <title>Cargar Simulación de Tráfico</title>
    <meta property="og:description" content="Seleccionar y cargar simulaciones de tráfico en mapa." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
    <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        #simulations-table { height: 30%; overflow-y: auto; }
        #map { height: 70%; }
        .selected-row { background-color: #d1ecf1; }
    </style>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<div>
    <div id="navbar-container"></div>
</div>

<div id="simulations-table" class="container-fluid p-3">
    <h4>Seleccionar Simulación de Tráfico</h4>
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID Simulación</th>
                <th>Fecha</th>
                <th>Número de Vehículos</th>
                <th>Periodo de Agregación</th>
                <th>Duración (seg)</th>
                <th>Archivo Tráfico</th>
            </tr>
        </thead>
        <tbody id="simulations-tbody">
            <!-- Filas se cargarán aquí -->
        </tbody>
    </table>
</div>

<div id="simulation-clock" style="display: none;">
    <div>
        <label class="clock-label" for="metric-select">Seleccionar Métrica:</label>
        <select class="clock-label" id="metric-select">
            <option value="density" selected>Densidad (veh/km)</option>
            <option value="occupancy">Ocupación (%)</option>
            <option value="speed">Velocidad (km/h)</option>
            <option value="flow">Flujo (veh/h)</option>
            <option value="waiting_time">Tiempo de espera (s)</option>
        </select>
    </div>
    <div>Tiempo total de Simulación</div>
    <b><div id="total-time-display"></div></b>
    <div>Tiempo de Agregación</div>
    <b><div id="aggregation-period-display"></div></b>

    <div class="clock-label">Tiempo de Simulación</div>
    <div id="time-display">00:00:00</div>
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div class="d-flex gap-2 align-items-center mt-2">
        <button id="backward-btn" type="button" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-skip-backward-fill"></i>
        </button>
        <button id="play-pause-btn" type="button" class="btn btn-primary btn-sm">Pausa</button>
        <button id="forward-btn" type="button" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-skip-forward-fill"></i>
        </button>
    </div>
    <div class="mt-2">
        <input id="time-slider" type="range" min="0" max="7200" step="10" value="0" class="form-range">
    </div>

    <div id="legend">
        <div class="clock-label mb-1">Leyenda</div>
        <div style="font-size:0.8rem;"></div>
    </div>
    
</div>

<!-- Leyenda dinámica -->


<div id="spinnerOverlay" class="spinner-overlay" style="display: none;">
    <div class="spinner"></div> <b class="text_loading">Loading...</b>
</div>

<div id="map"></div>

<script>
    fetch('./js/navbar.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('navbar-container').innerHTML = data;
        });

    // Configurar endpoint
    window.endPoint = 'http://localhost:8001';

    let isPaused = false;
    const btn = document.getElementById('play-pause-btn');
    const backwardBtn = document.getElementById('backward-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const timeSlider = document.getElementById('time-slider');
    const timeDisplay = document.getElementById('time-display');
    const progressBar = document.getElementById('progress-bar');
    const totalTimeDisplay = document.getElementById('total-time-display');
    const aggregationPeriodDisplay = document.getElementById('aggregation-period-display');

    let selectedMetric = 'density';
    let time = 0;
    window.maxSimulationTime = 3600;
    window.timeStep = 10;
    let selectedSimulation = null;

    // Escalas de color por métrica
    const metricScales = {
        density: {
            stops: [0, 10, 30, 60, 100, 200],
            colors: ['#F3F4F6', '#34D399', '#FACC15', '#FB923C', '#F87171', '#991B1B'],
            unit: 'veh/km'
        },
        occupancy: {
            stops: [0, 10, 25, 50, 75, 100],
            colors: ['#F3F4F6', '#34D399', '#FACC15', '#FB923C', '#F87171', '#991B1B'],
            unit: '%'
        },
        speed: {
            // Para velocidad invertimos: rápido = verde, lento = rojo
            stops: [0, 10, 20, 40, 60, 90],
            colors: ['#991B1B', '#F87171', '#FB923C', '#FACC15', '#34D399', '#F3F4F6'],
            unit: 'km/h'
        },
        flow: {
            stops: [0, 100, 300, 600, 1000, 2000],
            colors: ['#F3F4F6', '#34D399', '#FACC15', '#FB923C', '#F87171', '#991B1B'],
            unit: 'veh/h'
        },
        waiting_time: {
            stops: [0, 5, 15, 30, 60, 120],
            colors: ['#F3F4F6', '#34D399', '#FACC15', '#FB923C', '#F87171', '#991B1B'],
            unit: 's'
        }
    };

    function buildColorExpression(metric, timeKey) {
        const scale = metricScales[metric];
        const expr = [
            'interpolate', ['linear'],
            ['coalesce', ['get', timeKey, ['get', `${metric}_por_tiempo`]], 0]
        ];
        scale.stops.forEach((stop, i) => {
            expr.push(stop, scale.colors[i]);
        });
        return expr;
    }

    function renderLegend(metric) {
        const scale = metricScales[metric];
        const legend = document.getElementById('legend');
        legend.innerHTML = scale.stops.map((stop, i) =>
            `<span style="display:inline-flex;align-items:center;margin-right:8px;">
                <span style="width:18px;height:10px;background:${scale.colors[i]};display:inline-block;border-radius:2px;margin-right:3px;"></span>
                ${stop}${scale.unit}
             </span>`
        ).join('');
    }

    // Cargar simulaciones
    async function loadSimulations() {
        try {
            const response = await fetch(`${window.endPoint}/simulations`);
            const simulations = await response.json();
            const tbody = document.getElementById('simulations-tbody');
            tbody.innerHTML = '';
            simulations.forEach(sim => {
                const row = document.createElement('tr');
                const date = sim.date ? new Date(sim.date).toLocaleString('es-ES') : '-';
                row.innerHTML = `
                    <td>${sim.id_simulation}</td>
                    <td>${date}</td>
                    <td>${sim.num_vehicles}</td>
                    <td>${sim.aggregation_period}</td>
                    <td>${sim.duration_sec}</td>
                    <td>${sim.file_traffic}</td>
                `;
                row.addEventListener('click', () => selectSimulation(sim, row));
                tbody.appendChild(row);
            });
        } catch (error) {
            console.error('Error cargando simulaciones:', error);
        }
    }

    function selectSimulation(sim, row) {
        document.querySelectorAll('#simulations-tbody tr').forEach(r => r.classList.remove('selected-row'));
        row.classList.add('selected-row');
        selectedSimulation = sim;
        loadTraffic(sim);
    }

    async function loadTraffic(sim) {
        mostrarSpinner();
        try {
            const response = await fetch(`${window.endPoint}/get-traffic-data/${sim.file_traffic}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            window.timeStep = sim.aggregation_period;
            window.maxSimulationTime = sim.duration_sec;

            const geojsonData = await response.json();
            ocultarSpinner();
            isPaused = true;
            btn.innerText = 'Reanudar';
            document.getElementById('simulation-clock').style.display = 'block';
            totalTimeDisplay.innerText = formatTime(window.maxSimulationTime);
            aggregationPeriodDisplay.innerText = `${window.timeStep} segundos`;
            timeSlider.max = window.maxSimulationTime;
            timeSlider.step = window.timeStep;
            renderLegend(selectedMetric);

            if (map.getSource('traffic-source')) {
                map.getSource('traffic-source').setData(geojsonData);
            } else {
                map.addSource('traffic-source', {
                    type: 'geojson',
                    data: geojsonData
                });

                map.addLayer({
                    id: 'capa-traffic',
                    type: 'line',
                    source: 'traffic-source',
                    paint: {
                        'line-width': 3,
                        'line-color': buildColorExpression(selectedMetric, '0')
                    }
                });

                // Popup al hacer clic en una calle
                map.on('click', 'capa-traffic', (e) => {
                    const props = e.features[0].properties;
                    const timeKey = time.toString();
                    const metricLabel = document.getElementById('metric-select').selectedOptions[0].text;
                    const val = JSON.parse(props[`${selectedMetric}_por_tiempo`] || '{}')[timeKey] ?? '-';
                    new maplibregl.Popup()
                        .setLngLat(e.lngLat)
                        .setHTML(`
                            <strong>${props.nombre}</strong><br>
                            Tipo: ${props.tipo}<br>
                            Vel. máx.: ${props.velocidad_max?.toFixed(1) ?? '-'} km/h<br>
                            Carriles: ${props.carriles}<br>
                            <b>${metricLabel}:</b> ${typeof val === 'number' ? val.toFixed(2) : val}
                        `)
                        .addTo(map);
                });

                map.on('mouseenter', 'capa-traffic', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', 'capa-traffic', () => {
                    map.getCanvas().style.cursor = '';
                });
            }

            updateLayer();
        } catch (error) {
            console.error('Error cargando tráfico:', error);
            ocultarSpinner();
        }
    }

    btn.addEventListener('click', () => {
        isPaused = !isPaused;
        btn.innerText = isPaused ? 'Reanudar' : 'Pausa';
    });

    function renderTimeUI() {
        timeDisplay.innerText = formatTime(time);
        const percentage = (time / window.maxSimulationTime) * 100;
        progressBar.style.width = `${percentage}%`;
        timeSlider.value = time.toString();
    }

    function setTime(newTime) {
        const bounded = Math.max(0, Math.min(window.maxSimulationTime, newTime));
        time = Math.round(bounded / window.timeStep) * window.timeStep;
        renderTimeUI();
        updateLayer();
    }

    backwardBtn.addEventListener('click', () => setTime(time - window.timeStep));
    forwardBtn.addEventListener('click', () => setTime(time + window.timeStep));
    timeSlider.addEventListener('input', (e) => setTime(Number(e.target.value)));

    document.getElementById('metric-select').addEventListener('change', (e) => {
        selectedMetric = e.target.value;
        renderLegend(selectedMetric);
        updateLayer();
    });

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-1.652673, 42.805925],
        zoom: 15
    }));

    function updateLayer() {
        if (!map.getLayer('capa-traffic')) return;
        const timeKey = time.toString();
        map.setPaintProperty('capa-traffic', 'line-color', buildColorExpression(selectedMetric, timeKey));
    }

    map.on('load', () => {
        loadSimulations();
        setInterval(() => {
            if (isPaused) return;
            setTime((time + window.timeStep) % window.maxSimulationTime);
        }, 500);
    });

    function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return [h, m, s].map(v => v < 10 ? '0' + v : v).join(':');
    }

    function mostrarSpinner() {
        document.getElementById('spinnerOverlay').style.display = 'flex';
    }

    function ocultarSpinner() {
        document.getElementById('spinnerOverlay').style.display = 'none';
    }
</script>
</body>
</html>

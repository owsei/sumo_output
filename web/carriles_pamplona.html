<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calles de Pamplona</title>
    <meta property="og:description" content="Use the line-gradient and line-dasharray paint properties together to create a dashed line with gradient colors." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
     <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        .layer-toggle-panel {
            position: absolute;
            top: 84px;
            right: 14px;
            z-index: 1200;
            min-width: 190px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(15, 23, 42, 0.15);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(6px);
        }

        .layer-toggle-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .layer-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 0.84rem;
            color: #1e293b;
        }

        .layer-toggle-row:last-child {
            margin-bottom: 0;
        }

        .layer-toggle-btn {
            border: 1px solid rgba(148, 163, 184, 0.55);
            background: #ffffff;
            border-radius: 8px;
            width: 34px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #0f4c5c;
        }

        .layer-toggle-btn .bi {
            font-size: 1rem;
            line-height: 1;
        }

        #tipo-control-legend {
            bottom: 158px;
            min-width: 210px;
        }

        #tipo-control-legend .control-items {
            display: grid;
            gap: 6px;
        }

        #tipo-control-legend .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #1f2937;
        }

        #tipo-control-legend .control-dot {
            width: 12px;
            height: 12px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.18);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div>
    <div id="navbar-container"></div>
</div>

<script src="./js/sumo.js"></script>
<div id="map">
    
</div>
<div id="spinnerOverlay" class="spinner-overlay" >
    <div class="spinner"></div> <b class="text_loading">Loading...</b>
</div>

<div id="tipo-control-legend" class="legend">
    <h4>Control de nodos</h4>
    <div class="control-items">
        <div class="control-item"><span class="control-dot" style="background:#d1495b"></span><span>traffic_light</span></div>
        <div class="control-item"><span class="control-dot" style="background:#0f4c5c"></span><span>priority</span></div>
        <div class="control-item"><span class="control-dot" style="background:#f0b429"></span><span>right_before_left</span></div>
        <div class="control-item"><span class="control-dot" style="background:#64748b"></span><span>unregulated</span></div>
        <div class="control-item"><span class="control-dot" style="background:#2563eb"></span><span>otros</span></div>
    </div>
</div>

<div id="velocidad-legend" class="legend">
    <h4>Velocidad (km/h)</h4>
    <div class="gradient-bar"></div>
    <div class="labels">
        <span>0</span>
        <span>50</span>
        <span>100</span>
        <span>140+</span>
    </div>
</div>

<div class="layer-toggle-panel">
    <div class="layer-toggle-title">Capas del mapa</div>
    <div class="layer-toggle-row">
        <span>Carriles</span>
        <button id="toggle-carriles" type="button" class="layer-toggle-btn" title="Ocultar capa carriles" aria-label="Ocultar o mostrar carriles">
            <i class="bi bi-eye-fill"></i>
        </button>
    </div>
    <div class="layer-toggle-row">
        <span>Nodos</span>
        <button id="toggle-nodos" type="button" class="layer-toggle-btn" title="Ocultar capa nodos" aria-label="Ocultar o mostrar nodos">
            <i class="bi bi-eye-fill"></i>
        </button>
    </div>
</div>

<script>

    window.endPoint= "http://localhost:8001"

    fetch('./js/navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
    });

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-1.652673,42.805925],
        zoom: 15
    }));

    const interactiveLayers = new Set();
    const layerVisibilityState = {
        'capa-carriles': true,
        'capa-nodos': true
    };

    function applyLayerVisibility(layerId) {
        if (!map.getLayer(layerId)) {
            return;
        }
        const isVisible = layerVisibilityState[layerId] !== false;
        map.setLayoutProperty(layerId, 'visibility', isVisible ? 'visible' : 'none');
    }

    function refreshLayerToggleButton(buttonId, layerId, layerName) {
        const button = document.getElementById(buttonId);
        if (!button) {
            return;
        }
        const isVisible = layerVisibilityState[layerId] !== false;
        button.innerHTML = `<i class="bi ${isVisible ? 'bi-eye-fill' : 'bi-eye-slash-fill'}"></i>`;
        button.title = `${isVisible ? 'Ocultar' : 'Mostrar'} capa ${layerName}`;
        button.setAttribute('aria-label', `${isVisible ? 'Ocultar' : 'Mostrar'} ${layerName}`);
        button.setAttribute('aria-pressed', isVisible ? 'true' : 'false');
    }

    function toggleLayerVisibility(layerId, buttonId, layerName) {
        layerVisibilityState[layerId] = !layerVisibilityState[layerId];
        applyLayerVisibility(layerId);
        refreshLayerToggleButton(buttonId, layerId, layerName);
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function habilitarClickEnCapa(layerId, title) {
        if (interactiveLayers.has(layerId) || !map.getLayer(layerId)) {
            return;
        }

        interactiveLayers.add(layerId);

        map.on('mouseenter', layerId, () => {
            map.getCanvas().style.cursor = 'pointer';
        });

        map.on('mouseleave', layerId, () => {
            map.getCanvas().style.cursor = '';
        });

        map.on('click', layerId, event => {
            const feature = event.features && event.features[0];
            if (!feature) {
                return;
            }

            const props = feature.properties || {};
            const rows = Object.entries(props).map(([key, val]) => {
                return `<tr><th style="padding:2px 8px 2px 0;">${escapeHtml(key)}</th><td>${escapeHtml(val)}</td></tr>`;
            }).join('');

            const popupHtml = `
                <div style="font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;min-width:220px;">
                    <div style="font-weight:700;margin-bottom:6px;">${escapeHtml(title)}</div>
                    <table style="font-size:12px;line-height:1.3;border-collapse:collapse;">
                        ${rows || '<tr><td>Sin propiedades</td></tr>'}
                    </table>
                </div>
            `;

            new maplibregl.Popup({ closeButton: true, closeOnClick: true, maxWidth: '320px' })
                .setLngLat(event.lngLat)
                .setHTML(popupHtml)
                .addTo(map);
        });
    }

    document.getElementById('toggle-carriles').addEventListener('click', () => {
        toggleLayerVisibility('capa-carriles', 'toggle-carriles', 'carriles');
    });
    document.getElementById('toggle-nodos').addEventListener('click', () => {
        toggleLayerVisibility('capa-nodos', 'toggle-nodos', 'nodos');
    });
    refreshLayerToggleButton('toggle-carriles', 'capa-carriles', 'carriles');
    refreshLayerToggleButton('toggle-nodos', 'capa-nodos', 'nodos');


    async function cargarDatosCarriles(endPoint)   {
        
        mostrarSpinner();
        try {
            const res = await fetch(endPoint + '/carrilesPamplona');
            if (!res.ok) {
                throw new Error('Network response was not ok');
            }
            const geojsonData = await res.json();
            console.log(geojsonData);
            if (!map.isStyleLoaded()) {
                await new Promise(resolve => map.once('load', resolve));
            }
            if (map.getSource('carriles-pamplona')) {
                map.getSource('carriles-pamplona').setData(geojsonData);
            } else {
                map.addSource('carriles-pamplona', {
                    type: 'geojson',
                    data: geojsonData
                });
            }
            if (!map.getLayer('capa-carriles')) {
                map.addLayer({
                    id: 'capa-carriles',
                    type: 'line',
                    source: 'carriles-pamplona',
                    layout: {
                        'line-cap': 'round',
                        'line-join': 'round'
                    },
                    paint: {
                        'line-width': 2.5,
                        'line-opacity': 0.8,
                        'line-color': [
                            'interpolate',
                            ['linear'],
                            ['get', 'max_speed'],
                            0,      '#FFFFFF', // 0 km/h
                            1.39,   '#F2F12D', // 5 km/h
                            5.56,   '#EED322', // 20 km/h
                            8.33,   '#E6B71E', // 30 km/h
                            11.11,  '#DA9C20', // 40 km/h
                            13.89,  '#007324', // 50 km/h
                            19.44,  '#258C5D', // 70 km/h
                            22.22,  '#32A674', // 80 km/h
                            27.78,  '#3BB3C3', // 100 km/h
                            39.44,  '#004EB0'  // 140+ km/h
                        ],
                    }
                });
            }
            applyLayerVisibility('capa-carriles');
            habilitarClickEnCapa('capa-carriles', 'Información del carril');
            ocultarSpinner();
        } 
        catch (err) {
                console.error('Error fetching GeoJSON:', err)
                ocultarSpinner();
        } 
        finally {
                ocultarSpinner();
        }
    }
    
    async function cargarNodosPamplona(endPoint) {
        mostrarSpinner();
        try {
            const res = await fetch(endPoint + '/nodosPamplona');
            if (!res.ok) {
                throw new Error('Network response was not ok');
            }

            const geojsonData = await res.json();
            console.log(geojsonData);

            if (!map.isStyleLoaded()) {
                await new Promise(resolve => map.once('load', resolve));
            }

            if (map.getSource('nodos-pamplona')) {
                map.getSource('nodos-pamplona').setData(geojsonData);
            } else {
                map.addSource('nodos-pamplona', {
                    type: 'geojson',
                    data: geojsonData
                });
            }

            if (!map.getLayer('capa-nodos')) {
                map.addLayer({
                    id: 'capa-nodos',
                    type: 'line',
                    source: 'nodos-pamplona',
                    layout: {
                        'line-cap': 'round',
                        'line-join': 'round'
                    },
                    paint: {
                        'line-width': 2.5,
                        'line-opacity': 0.9,
                        'line-color': [
                            'match',
                            ['downcase', ['coalesce', ['to-string', ['get', 'tipo_control']], '']],
                            'traffic_light', '#d1495b',
                            'priority', '#0f4c5c',
                            'right_before_left', '#f0b429',
                            'unregulated', '#64748b',
                            '#2563eb'
                        ]
                    }
                });
            }

            applyLayerVisibility('capa-nodos');
            habilitarClickEnCapa('capa-nodos', 'Informacion del nodo');

            // Añadir interactividad al pasar el mouse sobre los nodos
            map.on('mouseenter', 'capa-carriles', () => {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'capa-carriles', () => {
                map.getCanvas().style.cursor = '';
            });

            // Mostrar información del nodo al hacer clic
            map.on('click', 'capa-carriles', (e) => {
                const properties = e.features[0].properties;
                const coordinates = e.lngLat;
                
                const popupContent = `
                    <div>
                        <strong>Carril: ${properties.id}</strong><br/>
                        <strong>Nombre:</strong> ${properties.name || 'N/A'}<br/>
                        <strong>Tipo:</strong> ${properties.type || 'N/A'}<br/>
                        <strong>Velocidad Máxima:</strong> ${properties.max_speed || 'N/A'} km/h<br/>
                        <strong>Permisos:</strong> ${properties.permisos || 'N/A'}
                        
                    </div>
                `;
                
                new maplibregl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(popupContent)
                    .addTo(map);
            });


            ocultarSpinner();

        } catch (err) {
            ocultarSpinner();
            console.error('Error fetching GeoJSON:', err);
        } finally {
            ocultarSpinner();
        }
    };
    
    
    cargarNodosPamplona(window.endPoint);
    async function cargarDatosNodos(endPoint)   {
        try {
            const response = await fetch(endPoint + '/nodosPamplona');
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            const geojsonData = await response.json();

            console.log('Nodos cargados:', geojsonData);
            
            // Añadimos la fuente de datos de nodos al mapa
            map.addSource('nodos-pamplona', {
                type: 'geojson',
                data: geojsonData
            });

            // Añadimos la capa visual para los nodos como linestrings
            map.addLayer({
                id: 'capa-nodos',
                type: 'line',
                source: 'nodos-pamplona',
                paint: {
                    'line-width': 3,
                    'line-color': '#Fff000',
                    'line-opacity': 0.9
                }
            });

            // Añadir interactividad al pasar el mouse sobre los nodos
            map.on('mouseenter', 'capa-nodos', () => {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'capa-nodos', () => {
                map.getCanvas().style.cursor = '';
            });

            // Mostrar información del nodo al hacer clic
            map.on('click', 'capa-nodos', (e) => {
                const properties = e.features[0].properties;
                const coordinates = e.lngLat;
                
                const popupContent = `
                    <div>
                        <strong>Nodo: ${properties.id}</strong><br/>
                        <strong>Nombre:</strong> ${properties.name || 'N/A'}<br/>
                        <strong>Tipo:</strong> ${properties.type || 'N/A'}<br/>
                        <strong>Lat:</strong> ${properties.lat || 'N/A'}<br/>
                        <strong>Lon:</strong> ${properties.lon || 'N/A'}
                    </div>
                `;
                
                new maplibregl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(popupContent)
                    .addTo(map);
            });

        } catch (err) {
            console.error('Error fetching nodos GeoJSON:', err);
        }
    };

    
    cargarDatosCarriles(window.endPoint);
    cargarDatosNodos(window.endPoint);
</script>


</body>
</html>

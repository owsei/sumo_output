<!DOCTYPE html>
<html lang="en">
<head>
    <title>SUMO Simulation Emissions</title>
    <meta property="og:description" content="Use the line-gradient and line-dasharray paint properties together to create a dashed line with gradient colors." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.20.1/dist/maplibre-gl.js'></script>
     <!--BOOTSTRAP-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<div id="simulation-clock">
    <div>
        <label class="clock-label" for="pollutant-select">Seleccionar Contaminante:</label>
        <select class="clock-label" id="pollutant-select">
            <option value="CO_abs">CO</option>
            <option value="CO2_abs">CO2</option>
            <option value="HC_abs">HC</option>
            <option value="PMx_abs">PMx</option>
            <option value="NOx_abs" selected>NOx</option>
            <option value="fuel_abs">Fuel</option>
        </select>
    </div>
    <div class="clock-label">Tiempo de Simulación</div>
    <div id="time-display">00:00:00</div>
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>
    <button id="play-pause-btn">Pausa</button>
</div>



<div>
    <div id="navbar-container"></div>
</div>

<script src="./js/sumo.js"></script>
<div id="map"></div>

<script>

    fetch('./js/navbar.html')
    .then(response => response.text())
    .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
    });

    let isPaused = false;
    const btn = document.getElementById('play-pause-btn');
    const timeDisplay = document.getElementById('time-display');
    const progressBar = document.getElementById('progress-bar');
    let selectedPollutant = 'NOx_abs'; // Default
    let time = 0; // Global time

    // Evento Click para el botón
    btn.addEventListener('click', () => {
        isPaused = !isPaused;
        btn.innerText = isPaused ? 'Reanudar' : 'Pausa';
        btn.classList.toggle('paused', isPaused);
    });

    // Evento para el select de contaminantes
    document.getElementById('pollutant-select').addEventListener('change', (e) => {
        selectedPollutant = e.target.value;
        updateLayer();
    });

    window.endPoint= "http://sumo-traffic:8001"

    const map = (window.map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
        center: [-1.652673,42.805925],
        zoom: 15
    }));

    function updateLayer() {
        const timeKey = time.toString();
        map.setPaintProperty('capa-emissions', 'line-color', [
            'interpolate',
            ['linear'],
            ['coalesce', ['get', timeKey, ['get', `${selectedPollutant}_por_tiempo`]], 0],
            0, '#F3F4F6', // De 0 a 9.9
            10, '#34D399', // De 10 a 19.9
            20, '#FACC15', // De 20 a 29.9
            30, '#FB923C', // De 30 a 39.9
            40, '#F87171', // De 40 a 49.9
            50, '#991B1B'  // 50 o más
        ]);
    }

    map.on('load', async () => {
        // Llamada al backend de FastAPI
        const response = await fetch(window.endPoint + '/get-emission-data')
        const geojsonData = await response.json();
        console.log(geojsonData);

        isPaused = true; // Pausamos para analizar
        btn.innerText = 'Reanudar';

        map.addSource('sumo-source', {
            type: 'geojson',
            data: geojsonData // Pasamos los datos recibidos de la API
        });

        map.addLayer({
            id: 'capa-emissions',
            type: 'line',
            source: 'sumo-source',
            paint: {
                'line-width': 3,
                'line-color': [
                    'interpolate',
                    ['linear'],
                    ['coalesce', ['get', '0', ['get', `${selectedPollutant}_por_tiempo`]], 0], // Empezamos en el segundo 0
                    0, '#F3F4F6', // De 0 a 9.9
                    10, '#34D399', // De 10 a 19.9
                    20, '#FACC15', // De 20 a 29.9
                    30, '#FB923C', // De 30 a 39.9
                    40, '#F87171', // De 40 a 49.9
                    50, '#991B1B'  // 50 o más
                ]
            }
        });


        // Lógica de animación (igual que antes)
        setInterval(() => {
            if (isPaused) return;
            time = (time + 10) % 7200;
            const timeKey = time.toString();
            console.log(timeKey);
            timeDisplay.innerText = formatTime(time);
            const percentage = (time / 7200) * 100;
            progressBar.style.width = `${percentage}%`;
            updateLayer();
        }, 500);

    });

    function formatTime(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return [h, m, s].map(v => v < 10 ? "0" + v : v).join(":");
    }

    document.getElementById('estilos').addEventListener('change', function (e) {
        map.setStyle(e.target.value);
    });
</script>

</body>
</html>

# Este bloque ayuda a decidir si cerrar la conexión o hacer el 'upgrade' a WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost; # Cambia esto por tu IP o dominio
    error_page   500 502 503 504  /50x.html;
    
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # Headers CORS para archivos estáticos
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
    }

    # 1. Ruta para el WebSocket específico
    location /api/ {
        proxy_pass http://fastapi:8000/;    
        
        proxy_http_version 1.1;
        # Cabeceras de rastreo para FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
         
         # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Tamaño máximo del body (subida de ficheros, etc.)
        client_max_body_size 20M;
       
    }

    location /api/docs {
        proxy_pass http://fastapi:8000/docs;
    }

}